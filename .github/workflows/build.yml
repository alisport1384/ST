name: Build APK

# فایل نصبی (APK امضاشده) را می‌سازد و به‌عنوان Artifact بالا می‌آورد.
#   • هر push به main / هر Pull Request / دکمهٔ «Run workflow»  → Artifact
#   • هر tag به شکل v1.2.3                                    → علاوه بر آن، یک Release با فایل نصبی
#
# نکات:
#   – کلید امضا (keystore/goldpin.jks) و رمزهایش داخل خود مخزن است (پروژهٔ شخصی)،
#     پس برای ساخت APK به هیچ Secret نیاز نیست.
#   – آزمون‌ها در job جدا اجرا می‌شوند تا خرابی آن‌ها مانع گرفتن فایل نصبی نشود.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'آزمون‌ها هم اجرا شوند؟'
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # هیپ بزرگ‌تر از gradle.properties — رانر گیت‌هاب رم کافی دارد و build سریع‌تر می‌شود
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
    -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dfile.encoding=UTF-8

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  #  ساخت فایل نصبی
  # ══════════════════════════════════════════════════════════════════════════
  apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.apk.outputs.version }}
      version_code: ${{ steps.apk.outputs.version_code }}
      apk_name: ${{ steps.apk.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # رانرهای ubuntu خودشان Android SDK دارند، پس هیچ action سومی لازم نیست.
          # android-actions/setup-android@v3 عمداً استفاده نمی‌شود: آن action بستهٔ
          # سال‌ها پیش حذف‌شدهٔ `tools` را نصب می‌کند و با «Failed to find package
          # 'tools'» شکست می‌خورد (در اجرای واقعی همین مخزن در ۲۰۲۶-۱۰-۰۸ دیده شد).
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK not found (tried $ANDROID_HOME)"; exit 1
          fi
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1
          fi
          echo "sdkmanager: $SDKMANAGER   ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # نام فایل قابل‌فهم + نسخهٔ واقعی خوانده‌شده از build.gradle.kts
      - name: Prepare APK for download
        id: apk
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          CODE="$(sed -n 's/.*versionCode *= *\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          # نکته: «+» در نام asset گیت‌هاب مجاز نیست و به «.» تبدیل می‌شود، پس از «-» استفاده می‌کنیم
          # تا نام فایل و محتوای .sha256 با هم بخوانند و `sha256sum -c` درست کار کند
          NAME="GoldPin-${VERSION}-${CODE}.${SHORT_SHA}.apk"

          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" | tee "${NAME}.sha256"

          # تأیید اینکه APK واقعاً امضا شده و نسخه‌اش درست است (وگرنه job باید بشکند)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/34.0.0 2>/dev/null || true)"
          if [ -n "$BT" ]; then
            "$BT/apksigner" verify --print-certs "$NAME" | head -3
            "$BT/aapt" dump badging "$NAME" | grep -E "^package" || true
          fi

          {
            echo "apk_name=$NAME"
            echo "version=$VERSION"
            echo "version_code=$CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldPin-${{ steps.apk.outputs.version }}-apk
          path: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 90

  # ══════════════════════════════════════════════════════════════════════════
  #  آزمون‌ها (جدا از ساخت APK — خرابی‌شان جلوی فایل نصبی را نمی‌گیرد)
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Tests (engine + app + cli)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_tests

    steps:
      - uses: actions/checkout@v4

      # بیت اجرایی `gradlew` را تضمین کن. بدون این، اگر کامیتی بیت را از دست بدهد
      # (اتفاقی که در e90c0fe/a1c30ee افتاد و هر دو جاب با exit 126 شکست کرد)
      # کل بیلد با «Permission denied» می‌میرد.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # رانرهای ubuntu خودشان Android SDK دارند، پس هیچ action سومی لازم نیست.
          # android-actions/setup-android@v3 عمداً استفاده نمی‌شود: آن action بستهٔ
          # سال‌ها پیش حذف‌شدهٔ `tools` را نصب می‌کند و با «Failed to find package
          # 'tools'» شکست می‌خورد (در اجرای واقعی همین مخزن در ۲۰۲۶-۱۰-۰۸ دیده شد).
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK not found (tried $ANDROID_HOME)"; exit 1
          fi
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1
          fi
          echo "sdkmanager: $SDKMANAGER   ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Engine tests (pure JVM)
        run: ./gradlew :engine:test --stacktrace

      - name: App unit tests (Robolectric)
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: CLI harness builds and runs on the bundled sample
        run: |
          set -euo pipefail
          ./gradlew :cli:installDist --stacktrace
          mkdir -p /tmp/gpdata
          gunzip -c app/src/main/assets/sample_xauusd_m1.csv.gz > /tmp/gpdata/sample.csv
          ./cli/build/install/cli/bin/cli --csv /tmp/gpdata/sample.csv --vol real

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/tests/
            engine/build/test-results/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  #  Release — فقط وقتی یک tag مثل v1.3.1 پوش شود
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: GoldPin-${{ needs.apk.outputs.version }}-apk
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
